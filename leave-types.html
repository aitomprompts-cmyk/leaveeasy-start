<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการประเภทการลา · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
    }
  }
  </script>
  <script src="js/util.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script type="module" src="js/leave-types.js"></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>จัดการประเภทการลา</h1>
    <p class="subtitle">ประเภทที่เพิ่มที่นี่ จะไปโผล่ในรายการเลื่อนลงของหน้ายื่นใบลาใหม่</p>

    <div class="card">
      <label for="ชื่อประเภทใหม่">เพิ่มประเภทการลาใหม่</label>
      <input type="text" id="ชื่อประเภทใหม่" placeholder="เช่น ลาคลอด">
      <div id="เตือนประเภท" class="alert alert-error hidden"></div>
      <div class="btn-row">
        <button type="button" id="ปุ่มเพิ่ม">เพิ่มประเภทการลา</button>
      </div>
    </div>

    <div class="card">
      <h2>ประเภทการลาที่มีอยู่</h2>
      <div id="ตารางประเภท"></div>
    </div>
  </div>
</body>
</html>
